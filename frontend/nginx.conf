server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Las rutas de Angular (/reservas, /usuarios, /laboratorios) no existen como
    # archivos: si no se encuentra el archivo pedido, se devuelve index.html y el
    # router de Angular decide qué pantalla mostrar.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html sin caché para que un Rolling Update se vea de inmediato;
    # los .js/.css llevan hash en el nombre y se pueden guardar en caché.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|ico|png|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Las rutas /api/... no llegan aquí: el Ingress las envía directo a cada microservicio.
}
