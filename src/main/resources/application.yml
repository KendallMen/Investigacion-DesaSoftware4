server:
  port: 8080

spring:
  application:
    name: ms-reservas
  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:1433;databaseName=reservas_db;encrypt=false;trustServerCertificate=true;sendTimeAsDatetime=false
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
  config:
    import: "optional:kubernetes:"
  cloud:
    kubernetes:
      discovery:
        enabled: true
      reload:
        enabled: true
        mode: polling
        period: 5000
    loadbalancer:
      cache:
        ttl: 5s
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 3000

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2
        ignoreExceptions:
          - feign.FeignException$NotFound
  timelimiter:
    configs:
      default:
        timeoutDuration: 5s

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

reservas:
  max-horas: 2

clientes:
  usuarios:
    url: ""
  laboratorios:
    url: ""
