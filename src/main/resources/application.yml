server:
  port: 8080

spring:
  application:
    name: ms-reservas
  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:1433;databaseName=reservas_db;encrypt=false;trustServerCertificate=true
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
  config:
    import: "optional:kubernetes:"
  cloud:
    kubernetes:
      discovery:
        enabled: true
      reload:
        enabled: true
        mode: polling
        period: 5000
    openfeign:
      circuitbreaker:
        enabled: true

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

reservas:
  max-horas: 2