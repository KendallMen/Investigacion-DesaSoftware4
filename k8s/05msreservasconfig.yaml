# ConfigMap + RBAC de ms-reservas (Spring Cloud Kubernetes).
# El ConfigMap se llama igual que spring.application.name (ms-reservas),
# así que spring.config.import=kubernetes: lo carga solo.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ms-reservas
  namespace: reservas-lab
data:
  reservas.max-horas: "2"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ms-reservas-sa
  namespace: reservas-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ms-reservas-reader
  namespace: reservas-lab
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ms-reservas-reader-binding
  namespace: reservas-lab
subjects:
  - kind: ServiceAccount
    name: ms-reservas-sa
    namespace: reservas-lab
roleRef:
  kind: Role
  name: ms-reservas-reader
  apiGroup: rbac.authorization.k8s.io
