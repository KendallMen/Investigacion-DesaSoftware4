# Credenciales de la base de datos (SOLO para el entorno local de Minikube).
# La contraseña de 'sa' debe tener al menos 8 caracteres con mayúsculas,
# minúsculas, números y símbolos, o el contenedor de SQL Server no arranca.
# Los microservicios leen DB_USER y DB_PASSWORD de este Secret.
apiVersion: v1
kind: Secret
metadata:
  name: sqlserver-secret
  namespace: reservas-lab
type: Opaque
stringData:
  DB_USER: "sa"
  DB_PASSWORD: "Reservas#2026Lab"